components:
    schemas:
        RecycleBinEntry:
            properties:
                creator:
                    $ref: ../../headless/headless-delivery/headless-delivery-impl/rest-openapi.yaml#Creator
                    description:
                        The recycle bin entry's creator.
                    readOnly: true
                dateCreated:
                    description:
                        The recycle bin entry's creation date.
                    format: date
                    readOnly: true
                    type: string
                externalReferenceCode:
                    description:
                        The recycle bin entry's external reference code.
                    readOnly: true
                    type: string
                spaceTitle:
                    description:
                        The recycle bin entry's space title.
                    readOnly: true
                    type: string
                title:
                    description:
                        The recycle bin entry's title.
                    readOnly: true
                    type: string
                type:
                    description:
                        The recycle bin entry's type.
                    readOnly: true
                    type: string
            required:
                -   creator
                -   dateCreated
                -   externalReferenceCode
                -   spaceTitle
                -   title
                -   type
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.trash.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: Liferay Recycle Bin Entry API
    version: v1.0
openapi: 3.0.1
paths:
    "/recycle-bin-entries/by-external-reference-code/{externalReferenceCode}":
        get:
            operationId: getRecycleBinEntryByExternalReferenceCode
            parameters:
                -   in: path
                    name: externalReferenceCode
                    required: true
                    schema:
                        type: string
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RecycleBinEntry"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/RecycleBinEntry"
            summary: Gets a recycle bin entry by external reference code.
            tags: ["RecycleBinEntry"]
    "/recycle-bin-entries/{siteGroupId}":
        get:
            operationId: getRecycleBinEntriesSiteGroupPage
            parameters:
                -   in: path
                    name: siteGroupId
                    required: true
                    schema:
                        format: int64
                        type: integer
                -   in: query
                    name: page
                    schema:
                        type: integer
                -   in: query
                    name: pageSize
                    schema:
                        type: integer
            responses:
                200:
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: "#/components/schemas/RecycleBinEntry"
                                type: array
                        application/xml:
                            schema:
                                items:
                                    $ref: "#/components/schemas/RecycleBinEntry"
                                type: array
            summary: Gets a list of recycle bin entries.
            tags: ["RecycleBinEntry"]